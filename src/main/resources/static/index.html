<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allstate Allstate All help Possible</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-container">
        <div class="brand-lockup">
          <img
            src="/allstate-hands.svg"
            alt=""
            class="brand-emblem"
            width="40"
            height="40"
            aria-hidden="true"
          />
          <img
            src="/allstate-wordmark.svg"
            alt="Allstate"
            class="brand-wordmark"
            width="120"
            height="25"
          />
        </div>
        <span class="header-service-title">Allstate All help possible</span>
      </div>
    </header>

    <main class="app-shell" id="app" data-state="idle">
      <header class="hero">
        <h1 class="hero-title">Tell us what happened</h1>
        <p class="hero-intro">
          Describe your issue and we will find the fastest safe option for you.
        </p>
      </header>

      <section class="main-panel">
        <form id="incidentForm" class="incident-form" novalidate>
          <label for="description">What do you need help with?</label>
          <textarea
            id="description"
            name="description"
            rows="4"
            maxlength="500"
            placeholder="Example: I ran out of fuel and I am parked on the shoulder."
            autocomplete="off"
          ></textarea>
          <div class="form-meta">
            <span id="charHint" class="char-hint" aria-live="polite"></span>
          </div>
          <div class="form-actions">
            <button type="submit" class="primary-button" id="submitButton">
              <span class="button-label">Get help now</span>
              <span class="button-spinner" aria-hidden="true"></span>
            </button>
            <button type="button" id="sampleButton" class="text-button">
              Try sample issue
            </button>
          </div>
        </form>

        <section
          id="resultPanel"
          class="result-panel"
          aria-live="polite"
          aria-atomic="true"
          hidden
        >
          <div class="response-card">
            <div class="response-header">
              <span class="decision-badge" id="decisionBadge">Ready</span>
              <h2 id="decisionTitle">We are here to help</h2>
            </div>
            <p class="summary-text" id="summaryText"></p>
            <div class="decision-body empty-state" id="decisionBody">
              <div class="help-icon" aria-hidden="true">...</div>
              <p>Your recommendation will appear here.</p>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
