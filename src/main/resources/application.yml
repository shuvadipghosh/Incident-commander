spring:
  application:
    name: incident-commander
  datasource:
    url: jdbc:h2:mem:incidentdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:7b
      embedding:
        model: nomic-embed-text
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: rsa-knowledge
        initialize-schema: true

server:
  port: 8080

logging:
  level:
    com.incident.commander: DEBUG
    org.springframework.ai: INFO